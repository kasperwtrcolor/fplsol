<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2E1E" />
      <stop offset="50%" stop-color="#142416" />
      <stop offset="100%" stop-color="#0A140B" />
    </linearGradient>

    <!-- Jersey Gradient -->
    <linearGradient id="kit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Sleeves Gradient -->
    <linearGradient id="sleeves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <!-- Gold Trendline Gradient -->
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg)" stroke="#2D4830" stroke-width="14" />
  
  <!-- Subtle Stadium Pitch Arc / Center Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10B981" stroke-width="6" stroke-opacity="0.15" stroke-dasharray="14 10" />

  <!-- Vector Kit Jersey Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Left Sleeve -->
    <polygon points="178,140 92,204 136,252 178,212" fill="url(#sleeves)" />
    <!-- Right Sleeve -->
    <polygon points="334,140 420,204 376,252 334,212" fill="url(#sleeves)" />
    <!-- Jersey Torso -->
    <path d="M178 140 L128 176 L144 196 L178 174 L178 376 C178 384 184 390 192 390 L320 390 C328 390 334 384 334 376 L334 174 L368 196 L384 176 L334 140 C306 166 274 180 256 180 C238 180 206 166 178 140 Z" fill="url(#kit)" filter="url(#glow)" />
    <!-- White V-Collar -->
    <path d="M216 150 Q256 195 296 150" fill="none" stroke="#FAFBF9" stroke-width="14" stroke-linecap="round" />
    
    <!-- Bold 'F' Tactical Monogram on Jersey Chest -->
    <path d="M236 210 L276 210 M236 242 L266 242 M236 210 L236 280" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Stock Trendline with Arrow (Rising Bull Equity Curve) -->
  <g filter="url(#shadow)">
    <!-- Glowing path behind -->
    <path d="M110 350 L195 285 L260 325 L385 155" fill="none" stroke="#F59E0B" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
    <!-- Main Gold Trendline -->
    <path d="M110 350 L195 285 L260 325 L385 155" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Trendline Nodes -->
    <circle cx="110" cy="350" r="10" fill="#F59E0B" />
    <circle cx="195" cy="285" r="10" fill="#F59E0B" />
    <circle cx="260" cy="325" r="10" fill="#FDE047" />
    <!-- Arrowhead -->
    <polygon points="410,135 365,145 385,185" fill="#FDE047" />
  </g>

  <!-- Stock Spark Indicator -->
  <circle cx="385" cy="155" r="8" fill="#FFFFFF" />
</svg>
